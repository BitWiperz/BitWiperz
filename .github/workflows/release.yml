name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libfuse2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install desktop dependencies
        run: |
          cd desktop
          pnpm install

      - name: Build frontend
        run: |
          cd desktop
          pnpm build
        env:
          VITE_API_URL: https://bitwiperz.onrender.com/api

      - name: Build and Publish Tauri Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_API_URL: https://bitwiperz.onrender.com/api
        with:
          projectPath: ./desktop
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.1' }}
          releaseName: 'BitWiperz ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.1' }}'
          releaseBody: 'Automated release of BitWiperz Data Sanitization Platform. Download the .deb package or .AppImage below.'
          releaseDraft: false
          prerelease: false
